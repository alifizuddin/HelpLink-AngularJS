<header class="navbar">
  <div class="navbar-container">

    <div class="navbar-left">

      <a
        routerLink="/home"
        routerLinkActive="nav-link-active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        class="navbar-brand"
      >
        <i class="fas fa-hand-holding-heart"></i>
        HelpLink
      </a>

      <nav class="desktop-nav">
        <a routerLink="/news" routerLinkActive="nav-link-active" ariaCurrentWhenActive="page" class="nav-link">News Dashboard</a>
        <a routerLink="/resources" routerLinkActive="nav-link-active" ariaCurrentWhenActive="page" class="nav-link">Resources</a>
        <a routerLink="/jobs" routerLinkActive="nav-link-active" ariaCurrentWhenActive="page" class="nav-link">Jobs</a>
        <a routerLink="/shelter" routerLinkActive="nav-link-active" ariaCurrentWhenActive="page" class="nav-link">Shelters</a>
        <a routerLink="/market" routerLinkActive="nav-link-active" ariaCurrentWhenActive="page" class="nav-link">Marketplace</a>
      </nav>

    </div>

    <div class="navbar-right">

      <div class="search-container">
        <i class="fas fa-search search-icon"></i>
        <input
          class="search-input"
          placeholder="Search resources..."
          type="text"
        />
      </div>

      <button routerLink="/help" routerLinkActive="nav-link-active" ariaCurrentWhenActive="page" class="btn-outline">
        Get Help
      </button>

      <button routerLink="/volunteer" routerLinkActive="nav-link-active" ariaCurrentWhenActive="page" class="btn-primary">
        Volunteer
      </button>

      <button class="mobile-menu-btn">
        <i class="fas fa-bars"></i>
      </button>

    </div>

  </div>
</header>
